<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 追问 · 教资面试陪跑</title>
<script src="assets/vendor/tailwind-play.js"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
<!-- PWA：可安装 + 离线（manifest / 图标；Service Worker 在 js/pwa.js 注册） -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<meta name="application-name" content="结构化面试 · 教资面试陪跑">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="教资面试陪跑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* 独立追问页：聊天区本身就是一张卡片，去掉评分卡里自带的虚线分隔与额外留白 */
  #chat-host .score-chat { margin-top: 0; padding-top: 0; border-top: 0; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3">
      <a id="btn-back" href="records.html" class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-slate-200 text-lg text-slate-600" aria-label="返回练习记录">‹</a>
      <div class="min-w-0">
        <h1 class="text-base font-bold">AI 追问</h1>
        <p id="page-sub" class="truncate text-[11px] text-slate-500">读取练习记录…</p>
      </div>
      <button type="button" data-open-settings class="ml-auto grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="AI 设置">⚙︎</button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 pb-24 pt-4">
    <!-- 记录摘要：本题得分 / 题目 / 当时的作答 -->
    <section id="record-summary" class="hidden rounded-2xl border border-slate-200 bg-white p-3.5">
      <div class="flex items-start gap-3">
        <div id="score-badge" class="grid h-14 w-14 shrink-0 place-items-center rounded-xl">
          <span id="score-total" class="text-lg font-bold leading-none tabular-nums">0</span>
          <span id="score-level" class="mt-0.5 text-[9px] font-semibold leading-none"></span>
        </div>
        <div class="min-w-0 flex-1">
          <div id="summary-tags" class="flex flex-wrap items-center gap-1.5"></div>
          <h2 id="summary-title" class="mt-1 text-sm font-bold leading-relaxed text-slate-900"></h2>
          <p id="summary-meta" class="mt-0.5 truncate text-[10px] text-slate-400"></p>
        </div>
      </div>
      <details id="summary-answer" class="mt-3 hidden rounded-xl bg-slate-50 p-2.5">
        <summary class="cursor-pointer text-[11px] font-semibold text-slate-600">查看我的答题内容</summary>
        <p id="summary-answer-text" class="mt-1.5 max-h-52 overflow-y-auto whitespace-pre-wrap text-[11px] leading-relaxed text-slate-600"></p>
      </details>
      <p class="mt-2 text-[10px] leading-relaxed text-slate-400">追问会自动带上本题、你的作答与本次评分；聊天记录按题目保存在本机浏览器。</p>
    </section>

    <!-- 追问窗口：复用 js/score-chat.js 的 AI 动态追问 + 预设追问库 -->
    <section id="chat-host" class="mt-3 hidden rounded-2xl border border-slate-200 bg-white p-3.5"></section>

    <!-- 读取中 / 失败 / 缺少参数 -->
    <section id="state-box" class="mt-3 rounded-2xl border border-dashed border-slate-300 bg-white px-4 py-8 text-center">
      <p id="state-title" class="text-xs font-bold text-slate-700">正在读取练习记录…</p>
      <p id="state-sub" class="mt-1 text-[11px] leading-relaxed text-slate-500">只读取本机浏览器里的记录</p>
      <div class="mt-3 flex justify-center gap-2">
        <a href="records.html" class="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 active:bg-slate-50">返回练习记录</a>
        <button id="btn-retry" type="button" class="hidden rounded-xl bg-brand-600 px-3 py-1.5 text-xs font-bold text-white active:bg-brand-700">重新读取</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/ai-chat.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
