<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习记录 · 教资面试陪跑</title>
<script src="assets/vendor/tailwind-play.js"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
<!-- PWA：可安装 + 离线（manifest / 图标；Service Worker 在 js/pwa.js 注册） -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<meta name="application-name" content="结构化面试 · 教资面试陪跑">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="教资面试陪跑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3">
      <a href="home.html" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-lg text-slate-600" aria-label="返回首页">‹</a>
      <div class="min-w-0">
        <h1 class="text-base font-bold">练习记录</h1>
        <p id="summary-text" class="truncate text-[11px] text-slate-500">读取本机记录…</p>
      </div>
      <button type="button" data-open-settings class="ml-auto grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="AI 设置">⚙︎</button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 pb-24 pt-4">
    <!-- 顶部统计：练习次数 / 平均分 / 最高分 -->
    <section id="stat-row" class="grid grid-cols-3 gap-2"></section>

    <!-- 筛选（全部 / 结构化 / 试讲，含计数） -->
    <div id="filter-row" class="no-scrollbar mt-3 flex gap-2 overflow-x-auto pb-1"></div>

    <!-- 列表工具条：条数说明 + 排序切换 -->
    <div class="mt-1.5 flex items-center justify-between gap-2">
      <p id="list-hint" class="min-w-0 truncate text-[11px] text-slate-500">读取中…</p>
      <button id="btn-sort" type="button" class="shrink-0 rounded-lg border border-slate-200 bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-600 active:bg-slate-50">最新优先</button>
    </div>

    <!-- 加载骨架 -->
    <div id="loading-box" class="mt-3 space-y-2">
      <div class="skeleton h-[72px] w-full"></div>
      <div class="skeleton h-[72px] w-full"></div>
      <div class="skeleton h-[72px] w-full"></div>
    </div>

    <section id="records-list" class="mt-3 space-y-2"></section>

    <p id="empty-tip" class="mt-4 hidden rounded-2xl border border-dashed border-slate-300 bg-white px-4 py-8 text-center text-xs leading-relaxed text-slate-500">
      还没有练习记录。<br>去完成一次评分，记录会自动出现在这里。
      <span class="mt-3 block">
        <a href="select.html?mode=structured" class="font-bold text-emerald-700">结构化面试 ›</a>
        <a href="select.html?mode=math" class="ml-3 font-bold text-emerald-700">数学试讲 ›</a>
      </span>
    </p>

    <section id="error-box" class="mt-4 hidden rounded-2xl border border-amber-200 bg-amber-50 px-4 py-5 text-center">
      <p class="text-xs font-bold text-amber-800">读不到本机记录</p>
      <p class="mt-1 text-[11px] leading-relaxed text-amber-700">
        可能是无痕模式、浏览器禁用了 IndexedDB，或读取超时。<br>换一个普通窗口重新打开试试。
      </p>
      <button id="btn-retry" type="button" class="mt-3 rounded-xl border border-amber-300 bg-white px-3 py-1.5 text-xs font-bold text-amber-800 active:bg-amber-100">重新读取</button>
    </section>

    <section id="danger-zone" class="mt-6 hidden">
      <button id="btn-clear" type="button" class="h-11 w-full rounded-xl border border-rose-200 bg-rose-50 text-xs font-bold text-rose-600 active:bg-rose-100">清空全部记录</button>
      <p id="clear-hint" class="mt-2 text-center text-[11px] text-slate-400">记录只存在本机浏览器，清空后无法恢复。</p>
    </section>
  </main>

  <script type="module" src="js/records-page.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
