<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>限时作答 · 教资面试陪跑</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <script src="assets/vendor/tailwind-play.js"></script>
  <script src="js/tailwind-config.js"></script>
  <!-- PWA：可安装 + 离线（manifest / 图标；Service Worker 在 js/pwa.js 注册） -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <meta name="application-name" content="结构化面试 · 教资面试陪跑" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="教资面试陪跑" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body class="min-h-screen bg-slate-50 pb-28">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3">
      <a id="btn-back" href="structured-hub.html" class="grid h-11 w-11 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="返回题目列表">‹</a>
      <div class="min-w-0">
        <h1 id="page-title" class="truncate text-sm font-bold text-slate-900">结构化 · 限时作答</h1>
        <p class="text-[11px] text-slate-500">只保留题干与计时 · 2 分钟 · 六维评分</p>
      </div>
      <button type="button" data-open-settings class="ml-auto grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="AI 设置">⚙︎</button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl space-y-3 px-4 pt-4">
    <!-- 模块 1：题干 -->
    <section id="module-question" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="rounded-md bg-brand-50 px-2 py-0.5 text-[11px] font-semibold text-brand-700">题目</span>
        <span id="q-type" class="truncate text-[11px] text-slate-500">加载中…</span>
        <button id="btn-new-question" type="button" class="ml-auto h-11 shrink-0 rounded-lg border border-slate-200 px-3.5 text-xs font-semibold text-slate-600 active:bg-slate-50">换一题</button>
      </div>
      <p id="q-text" class="mt-3 text-[15px] font-semibold leading-relaxed text-slate-900">正在读取题库…</p>
      <p id="q-meta" class="mt-2 text-[11px] text-slate-400"></p>
      <p class="mt-3 rounded-xl bg-amber-50 px-3 py-2 text-[11px] leading-relaxed text-amber-800">
        答题模板在单独页面（题型 › 查看模板），本页不展示框架，先自己说完整。
      </p>
    </section>

    <!-- 模块 2：计时器（固定 2 分钟） -->
    <section id="module-timer" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="rounded-md bg-amber-50 px-2 py-0.5 text-[11px] font-semibold text-amber-700">计时器 · 固定 2 分钟</span>
        <span id="timer-state" class="text-[11px] text-slate-400">未开始</span>
      </div>
      <div class="mt-3 flex items-center gap-3">
        <div id="timer-clock" class="text-4xl font-bold tabular-nums leading-none text-slate-900">02:00</div>
        <div class="flex gap-2">
          <button id="btn-timer-toggle" type="button" class="h-11 rounded-xl bg-brand-600 px-4 text-xs font-bold text-white active:bg-brand-700">开始</button>
          <button id="btn-timer-reset" type="button" class="h-11 rounded-xl border border-slate-200 px-4 text-xs font-semibold text-slate-600 active:bg-slate-50">重置</button>
        </div>
      </div>
      <div class="level-bar mt-3"><div id="timer-bar" class="level-bar__fill" style="width:100%"></div></div>
      <p class="mt-2 text-[11px] leading-relaxed text-slate-400">到点会响提示音；时间到了仍可以提交评分。换题会自动重置为 02:00。</p>
    </section>

    <!-- 模块 3：作答记录 -->
    <section id="module-answer" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="rounded-md bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-700">作答记录</span>
        <span id="rec-state" class="text-[11px] text-slate-400">未录音</span>
      </div>
      <textarea id="answer-input" rows="6" class="mt-3 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-base leading-relaxed text-slate-800 focus:border-brand-400 focus:bg-white focus:outline-none" placeholder="第一，……；第二，……；第三，……"></textarea>
      <div class="mt-1.5 flex items-center justify-between text-[11px] text-slate-400">
        <span id="char-count">0 字</span>
        <span id="rec-hint">语音识别可用时自动转写</span>
      </div>
      <div class="mt-2 flex flex-wrap items-center gap-2">
        <button id="btn-record" type="button" class="hold-talk h-11 rounded-xl bg-rose-50 px-3.5 text-xs font-bold text-rose-600 active:bg-rose-100">● 开始录音</button>
        <span id="rec-time" class="text-[11px] text-slate-400"></span>
      </div>
      <p class="mt-1.5 text-[11px] leading-relaxed text-slate-400">手机上「按住说话」：按住即开始，松开自动结束并转写；手指滑走可放弃本次录音。</p>
      <audio id="rec-audio" class="mt-2 hidden w-full" controls></audio>

      <h3 class="mt-3 text-xs font-bold text-slate-900">答题纸照片（手机可直接拍照存档）</h3>
      <div class="mt-2 flex flex-wrap items-center gap-2">
        <label for="photo-input" class="inline-flex h-11 cursor-pointer items-center rounded-xl border border-slate-200 bg-slate-50 px-3.5 text-xs font-semibold text-slate-600 active:bg-slate-100">
          📷 拍照 / 上传
        </label>
        <input id="photo-input" type="file" accept="image/*" capture="environment" class="hidden" />
        <span id="photo-state" class="text-[11px] text-slate-400">未上传答题纸照片</span>
      </div>
      <div id="photo-preview" class="photo-grid mt-2 hidden"></div>
    </section>

    <!-- 模块 4：评分 -->
    <section id="module-score" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="rounded-md bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600">评分反馈</span>
        <span id="score-status" class="text-[11px] text-slate-400"></span>
      </div>
      <button id="btn-score" type="button" class="mt-3 h-11 w-full rounded-xl bg-slate-900 text-sm font-bold text-white active:bg-slate-800">提交并评分</button>
      <div id="score-card" class="mt-4 hidden"></div>
    </section>
  </main>

  <div class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white/95 px-4 py-3 backdrop-blur" style="padding-bottom:calc(0.75rem + env(safe-area-inset-bottom));">
    <div class="mx-auto flex max-w-3xl items-center gap-3">
      <div class="min-w-0">
        <p class="text-[11px] text-slate-400">剩余时间</p>
        <p id="sticky-clock" class="text-lg font-bold tabular-nums leading-tight text-slate-900">02:00</p>
      </div>
      <button id="btn-sticky-score" type="button" class="h-12 flex-1 rounded-xl bg-brand-600 text-sm font-bold text-white active:bg-brand-700">提交并评分</button>
    </div>
  </div>

  <script type="module" src="js/structured-page.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
