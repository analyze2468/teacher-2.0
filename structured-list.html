<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>题目列表 · 教资面试陪跑</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <script src="assets/vendor/tailwind-play.js"></script>
  <script src="js/tailwind-config.js"></script>
  <!-- PWA：可安装 + 离线（manifest / 图标；Service Worker 在 js/pwa.js 注册） -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <meta name="application-name" content="结构化面试 · 教资面试陪跑" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="教资面试陪跑" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body class="min-h-screen bg-slate-50 pb-28">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3">
      <a href="structured-hub.html" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="返回题型">‹</a>
      <div class="min-w-0">
        <h1 id="list-title" class="truncate text-sm font-bold text-slate-900">题目列表</h1>
        <p id="list-count" class="text-[11px] text-slate-500">加载中…</p>
      </div>
      <button type="button" data-open-settings class="ml-auto grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="AI 设置">⚙︎</button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 pt-4">
    <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
      <input
        id="search-input"
        type="search"
        inputmode="search"
        placeholder="搜索题干或关键词，如 家长、活动"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-base text-slate-800 placeholder:text-slate-400 focus:border-brand-400 focus:bg-white focus:outline-none"
      />
      <div class="mt-2.5 flex items-center justify-between gap-2">
        <span id="list-hint" class="text-[11px] text-slate-400">加载中…</span>
        <a id="btn-template" href="structured-hub.html" class="text-[11px] font-semibold text-brand-700">看这类模板 ›</a>
      </div>
    </div>

    <div id="list" class="mt-3 space-y-2.5" aria-busy="true">
      <div class="h-20 rounded-2xl skeleton"></div>
      <div class="h-20 rounded-2xl skeleton"></div>
      <div class="h-20 rounded-2xl skeleton"></div>
    </div>

    <p id="empty-tip" class="mt-3 hidden rounded-2xl border border-dashed border-slate-300 bg-white px-4 py-8 text-center text-xs leading-relaxed text-slate-500">
      没有匹配的题目，换个关键词试试；也可以回上一页换一个题型。
    </p>

    <section id="list-error" class="mt-3 hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-4 text-xs leading-relaxed text-rose-700">
      <p id="list-error-text">题目加载失败。</p>
      <a href="structured-hub.html" class="mt-2.5 inline-block h-9 rounded-lg bg-rose-600 px-3 leading-9 text-xs font-bold text-white">回到题型列表</a>
    </section>
  </main>

  <div class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white/95 px-4 py-3 backdrop-blur" style="padding-bottom:calc(0.75rem + env(safe-area-inset-bottom));">
    <div class="mx-auto flex max-w-3xl items-center gap-2">
      <button id="btn-random" type="button" class="h-12 flex-1 rounded-xl bg-brand-600 text-sm font-bold text-white active:bg-brand-700">
        随机抽一题
      </button>
    </div>
  </div>

  <script type="module" src="js/structured-list-page.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
