<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>结构化面试 · 教资面试陪跑</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <script src="assets/vendor/tailwind-play.js"></script>
  <script src="js/tailwind-config.js"></script>
  <!-- PWA：可安装 + 离线（manifest / 图标；Service Worker 在 js/pwa.js 注册） -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <meta name="application-name" content="结构化面试 · 教资面试陪跑" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="教资面试陪跑" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body class="min-h-screen bg-slate-50 pb-10">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3">
      <a href="home.html" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="返回首页">‹</a>
      <div class="min-w-0">
        <h1 class="truncate text-sm font-bold text-slate-900">结构化面试</h1>
        <p id="hub-meta" class="text-[11px] text-slate-500">五大题型 · 模板与刷题分开</p>
      </div>
      <button type="button" data-open-settings class="ml-auto grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-slate-600" aria-label="AI 设置">⚙︎</button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 pt-4">
    <section class="rounded-2xl bg-gradient-to-br from-brand-600 to-brand-800 px-5 py-5 text-white shadow-sm">
      <p class="text-[11px] font-semibold tracking-wide text-white/70">三步走</p>
      <h2 class="mt-1 text-lg font-bold leading-snug">先看模板，再开口，最后看评分</h2>
      <div class="mt-3 grid grid-cols-3 gap-2 text-center text-[11px]">
        <div class="rounded-xl bg-white/15 px-2 py-2.5">
          <p class="text-base font-bold">①</p>
          <p class="mt-0.5 font-semibold">看模板</p>
          <p class="mt-0.5 text-white/70">每类一套框架</p>
        </div>
        <div class="rounded-xl bg-white/15 px-2 py-2.5">
          <p class="text-base font-bold">②</p>
          <p class="mt-0.5 font-semibold">刷题</p>
          <p class="mt-0.5 text-white/70">只留题干 + 2 分钟</p>
        </div>
        <div class="rounded-xl bg-white/15 px-2 py-2.5">
          <p class="text-base font-bold">③</p>
          <p class="mt-0.5 font-semibold">评分</p>
          <p class="mt-0.5 text-white/70">六维反馈</p>
        </div>
      </div>
      <p class="mt-3 text-[11px] leading-relaxed text-white/80">
        模板页单独存放答题框架，作答页只有题干、计时器和提交按钮，练的时候不给自己看答案的机会。
      </p>
    </section>

    <div class="mt-4 flex items-end justify-between px-1">
      <h2 class="text-sm font-bold text-slate-900">选择题型</h2>
      <span id="hub-count" class="text-[11px] text-slate-400">加载中…</span>
    </div>

    <div id="type-list" class="mt-2 space-y-3" aria-busy="true">
      <div class="h-40 rounded-2xl skeleton"></div>
      <div class="h-40 rounded-2xl skeleton"></div>
      <div class="h-40 rounded-2xl skeleton"></div>
    </div>

    <section id="hub-error" class="mt-3 hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-4 text-xs leading-relaxed text-rose-700">
      <p id="hub-error-text">题型加载失败。</p>
      <button id="btn-retry" type="button" class="mt-2.5 h-9 rounded-lg bg-rose-600 px-3 text-xs font-bold text-white active:bg-rose-700">重新加载</button>
    </section>

    <nav class="mt-4 grid grid-cols-2 gap-2">
      <a href="records.html" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-center active:bg-slate-50">
        <span class="block text-xs font-bold text-slate-900">练习记录</span>
        <span class="mt-0.5 block text-[10px] text-slate-400">统计 · 筛选 · 删除</span>
      </a>
      <a href="videos.html" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-center active:bg-slate-50">
        <span class="block text-xs font-bold text-slate-900">示范视频</span>
        <span class="mt-0.5 block text-[10px] text-slate-400">结构 / 试讲 / 礼仪</span>
      </a>
    </nav>

    <p class="mt-4 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5 text-[11px] leading-relaxed text-amber-800">
      答题模板整理自公开备考资料，仅作练习参考；可在「我的模板」里改成自己的说法。
    </p>
  </main>

  <script type="module" src="js/structured-hub-page.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
